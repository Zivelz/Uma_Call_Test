  <style>
    :root {
      --bg: #090b14;
      --card-bg: rgba(18, 24, 43, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-active-bg: rgba(30, 42, 77, 0.95);
      --card-active-border: #facc15;
      
      --color-action: #fde047;  /* 1단 동작: 노란색 */
      --color-jp: #ffffff;      /* 2단 원문: 흰색 */
      --color-kr: #38bdf8;      /* 3단 번역: 파란색 */
      --color-pron: #c084fc;    /* 4단 독음: 보라색 */
      --color-call: #fb7185;    /* 5단 콜: 핑크 */

      --text-sub: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      background: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, #17203b 0%, #090b14 75%);
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* 상단 헤더 */
    header {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      z-index: 50;
    }
    .header-title h1 { font-size: 1.05rem; font-weight: 800; color: #fff; }
    .header-title span { font-size: 0.75rem; color: var(--color-action); font-weight: 600; }

    .toggle-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }
    .toggle-btn {
      background: #1e293b;
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .toggle-btn.active {
      background: #334155;
      border-color: var(--color-action);
      color: #fff;
      font-weight: 600;
    }

    /* 메인 분할 뷰포트 */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 460px 1fr;
      gap: 20px;
      padding: 16px;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
      height: calc(100% - 55px);
      overflow: hidden;
    }

    /* 좌측 고정 패널 */
    .player-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100%;
      overflow-y: auto;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      flex-shrink: 0;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }
    .status-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: monospace;
      font-size: 0.95rem;
      color: var(--color-action);
      flex-shrink: 0;
    }
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      flex-shrink: 0;
    }
    .btn {
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      transition: all 0.2s;
    }
    .btn-primary { background: #2563eb; grid-column: span 2; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #1e293b; border: 1px solid var(--card-border); color: #cbd5e1; }
    .btn-secondary:hover { background: #334155; }

    /* 우측 독립 스크롤 타임라인 */
    .timeline-section {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 4px 10px 40px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      scroll-behavior: smooth;
    }
    .timeline-section::-webkit-scrollbar { width: 6px; }
    .timeline-section::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); border-radius: 3px; }
    .timeline-section::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 3px; }
    .timeline-section::-webkit-scrollbar-thumb:hover { background: var(--color-action); }

    /* 모바일 반응형 분할 */
    @media (max-width: 900px) {
      main {
        display: flex;
        flex-direction: column;
        padding: 8px;
        gap: 10px;
        height: calc(100% - 50px);
      }
      .player-section {
        flex-shrink: 0;
        height: auto;
        overflow: visible;
        padding-bottom: 4px;
        border-bottom: 1px solid var(--card-border);
      }
      .video-wrapper { max-height: 200px; }
      .timeline-section {
        flex: 1;
        width: 100%;
        padding-bottom: 60px;
      }
    }

    /* 1줄 카드 스타일 */
    .lyric-card {
      width: 100%;
      max-width: 700px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 18px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      flex-shrink: 0;
    }
    .lyric-card:hover {
      border-color: rgba(250, 204, 21, 0.4);
      transform: translateY(-2px);
    }
    .lyric-card.active {
      background: var(--card-active-bg);
      border-color: var(--card-active-border);
      box-shadow: 0 0 20px rgba(250, 204, 21, 0.35);
      transform: scale(1.015);
    }

    .card-meta {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      color: var(--text-sub);
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 1px dashed rgba(255,255,255,0.06);
    }
    .time-edit-box {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge-time {
      color: var(--color-action);
      font-family: monospace;
      font-weight: 700;
      font-size: 0.82rem;
    }

    .card-tools {
      display: none;
      align-items: center;
      gap: 6px;
    }
    body.is-editing .card-tools { display: flex; }
    .btn-mini {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.15);
      color: #cbd5e1;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .btn-mini:hover { background: #334155; color: #fff; }
    .btn-delete { color: #f87171; border-color: rgba(248, 113, 113, 0.3); }
    .btn-delete:hover { background: #7f1d1d; color: #fff; }

    /* 5단 세로 필드 */
    .field-block {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .field-row {
      width: 100%;
      word-break: keep-all;
      overflow-wrap: break-word;
      white-space: pre-wrap;
      font-family: "Consolas", "Courier New", "Noto Sans Mono", monospace, sans-serif;
      min-height: 0;
      line-height: 1.4;
      text-align: center;
    }

    .row-action { color: var(--color-action); font-size: 0.9rem; font-weight: 700; }
    .row-jp { color: var(--color-jp); font-size: 1.1rem; font-weight: 800; }
    .row-kr { color: var(--color-kr); font-size: 0.94rem; font-weight: 600; }
    .row-pron { color: var(--color-pron); font-size: 0.88rem; font-weight: 500; }
    .row-call { color: var(--color-call); font-size: 1.02rem; font-weight: 800; }

    /* 빈 행 숨김 */
    body:not(.is-editing) .field-row:empty {
      display: none !important;
    }

    /* 편집 모드 점선 복원 */
    body.is-editing .field-row {
      min-height: 24px;
      padding: 2px 6px;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      margin-bottom: 2px;
    }
    body.is-editing .field-row:empty::after {
      content: attr(data-placeholder);
      color: rgba(255, 255, 255, 0.3);
      font-style: italic;
      font-size: 0.78rem;
    }
    body.is-editing .badge-time {
      border-bottom: 1px dashed var(--color-action);
      padding: 1px 4px;
      cursor: text;
    }

    /* 토글 스위치 */
    body.hide-action .row-action { display: none !important; }
    body.hide-jp .row-jp { display: none !important; }
    body.hide-kr .row-kr { display: none !important; }
    body.hide-pron .row-pron { display: none !important; }
    body.hide-call .row-call { display: none !important; }
  </style>
</head>

    let isEditing = false;
    let player = null;
    let lastActiveIdx = -1;

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', {
        videoId: 'vsnyQd6Ur-M',
        playerVars: {
          playsinline: 1,
          rel: 0,
          modestbranding: 1
        },
        events: {
          'onReady': () => {
            document.getElementById('sync-status').textContent = '준비 완료 (재생 대기)';
            startSyncLoop();
          },
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      const statusText = document.getElementById('sync-status');
      if (isEditing) {
        statusText.textContent = "✏️ 편집 모드 (싱크 일시정지)";
        return;
      }
      if (event.data === YT.PlayerState.PLAYING) {
        statusText.textContent = "▶ LIVE SYNCING";
      } else if (event.data === YT.PlayerState.PAUSED) {
        statusText.textContent = "⏸ 일시정지";
      } else if (event.data === YT.PlayerState.BUFFERING) {
        statusText.textContent = "⏳ 버퍼링 중";
      }
    }

    function formatTime(sec) {
      if (isNaN(sec) || sec < 0) sec = 0;
      const m = Math.floor(sec / 60);
      const s = (sec % 60).toFixed(1);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(4, '0')}`;
    }

    function parseTimeString(str) {
      str = str.replace(/[\[\]]/g, '').trim();
      if (str.includes(':')) {
        const parts = str.split(':');
        const m = parseFloat(parts[0]) || 0;
        const s = parseFloat(parts[1]) || 0;
        return m * 60 + s;
      }
      return parseFloat(str) || 0;
    }

    // 0.1초 고정밀 폴링 루프
    function startSyncLoop() {
      setInterval(() => {
        if (!player || typeof player.getCurrentTime !== 'function') return;
        
        let cur = 0;
        let dur = 0;
        try {
          cur = player.getCurrentTime() || 0;
          dur = player.getDuration() || 0;
        } catch (e) {
          return;
        }

        // 시간 디스플레이는 상시 갱신
        document.getElementById('time-display').textContent = `${formatTime(cur)} / ${formatTime(dur)}`;

        // [핵심] 편집 모드 중에는 카드 전환 및 자동 스크롤을 완전히 차단
        if (isEditing) return;

        let activeIdx = -1;
        for (let i = 0; i < cardsData.length; i++) {
          if (cur >= cardsData[i].time) {
            activeIdx = i;
          } else {
            break;
          }
        }

        if (activeIdx !== lastActiveIdx) {
          lastActiveIdx = activeIdx;
          const container = document.getElementById('cards-container');
          const cards = container.querySelectorAll('.lyric-card');
          
          cards.forEach((card, idx) => {
            if (idx === activeIdx) {
              card.classList.add('active');
              const offsetTop = card.offsetTop - container.offsetTop;
              const scrollTarget = offsetTop - (container.clientHeight / 2) + (card.clientHeight / 2);
              container.scrollTo({ top: scrollTarget, behavior: 'smooth' });
            } else {
              card.classList.remove('active');
            }
          });
        }
      }, 100);
    }

    function renderCards() {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      cardsData.sort((a, b) => a.time - b.time);

      cardsData.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'lyric-card' + (index === lastActiveIdx ? ' active' : '');
        card.dataset.index = index;

        card.innerHTML = `
          <div class="card-meta">
            <div class="time-edit-box">
              <span class="badge-time" data-placeholder="00:00.0">[${formatTime(item.time)}]</span>
              <div class="card-tools">
                <button class="btn-mini btn-sync-now" title="현재 재생 시점으로 맞춤">⏱ 현시점</button>
                <button class="btn-mini btn-delete" title="카드 삭제">✕</button>
              </div>
            </div>
            <span>#${String(index + 1).padStart(2, '0')}</span>
          </div>

          <div class="field-block">
            <div class="field-row row-action" data-field="action" data-placeholder="[동작/액션 입력]">${item.action || ''}</div>
            <div class="field-row row-jp" data-field="jp" data-placeholder="[일본어 가사 입력]">${item.jp || ''}</div>
            <div class="field-row row-kr" data-field="kr" data-placeholder="[한국어 번역 입력]">${item.kr || ''}</div>
            <div class="field-row row-pron" data-field="pron" data-placeholder="[발음 독음 입력]">${item.pron || ''}</div>
            <div class="field-row row-call" data-field="call" data-placeholder="[콜 타이밍 및 구호 입력]">${item.call || ''}</div>
          </div>
        `;

        card.addEventListener('click', () => {
          if (isEditing) return;
          if (player && typeof player.seekTo === 'function') {
            player.seekTo(item.time, true);
          }
        });

        const timeBadge = card.querySelector('.badge-time');
        timeBadge.contentEditable = isEditing;
        timeBadge.addEventListener('blur', () => {
          const parsed = parseTimeString(timeBadge.innerText);
          cardsData[index].time = parseFloat(parsed.toFixed(1));
          timeBadge.innerText = `[${formatTime(cardsData[index].time)}]`;
        });

        const btnSyncNow = card.querySelector('.btn-sync-now');
        btnSyncNow.addEventListener('click', (e) => {
          e.stopPropagation();
          if (player && typeof player.getCurrentTime === 'function') {
            const cur = parseFloat(player.getCurrentTime().toFixed(1));
            cardsData[index].time = cur;
            timeBadge.innerText = `[${formatTime(cur)}]`;
          }
        });

        const btnDelete = card.querySelector('.btn-delete');
        btnDelete.addEventListener('click', (e) => {
          e.stopPropagation();
          cardsData.splice(index, 1);
          renderCards();
        });

        card.querySelectorAll('.field-row').forEach(row => {
          row.contentEditable = isEditing;
          row.addEventListener('input', () => {
            const field = row.dataset.field;
            cardsData[index][field] = row.innerText;
          });
        });

        container.appendChild(card);
      });
    }

    // 편집 모드 토글
    document.getElementById('btn-toggle-edit').addEventListener('click', (e) => {
      isEditing = !isEditing;
      document.body.classList.toggle('is-editing', isEditing);
      
      const statusText = document.getElementById('sync-status');
      if (isEditing) {
        statusText.textContent = "✏️ 편집 모드 (싱크 일시정지)";
        e.target.textContent = '✅ 편집 완료 (시간순 정렬 및 저장)';
        e.target.style.background = '#059669';
      } else {
        statusText.textContent = "▶ LIVE SYNCING";
        e.target.textContent = '✏️ 가사/시간/콜 편집 켜기';
        e.target.style.background = '#2563eb';
        lastActiveIdx = -1; // 편집 모드 종료 시 재탐색
      }
      renderCards();
    });

    // 새 카드 추가
    document.getElementById('btn-add-card').addEventListener('click', () => {
      let curTime = 0;
      if (player && typeof player.getCurrentTime === 'function') {
        curTime = player.getCurrentTime();
      }
      cardsData.push({
        time: parseFloat(curTime.toFixed(1)),
        action: "",
        jp: "",
        kr: "",
        pron: "",
        call: ""
      });
      renderCards();
    });

    // 항목 표시/숨김 토글
    document.querySelectorAll('.toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.dataset.target;
        btn.classList.toggle('active');
        document.body.classList.toggle(target, !btn.classList.contains('active'));
      });
    });

    // JSON 내보내기 (다운로드)
    document.getElementById('btn-export-json').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(cardsData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'ms_victoria_1line_call_cards.json';
      a.click();
      URL.revokeObjectURL(url);
    });

    // JSON 파일 불러오기
    document.getElementById('btn-import-json').addEventListener('click', () => {
      document.getElementById('file-input').click();
    });

    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const loadedData = JSON.parse(event.target.result);
          if (Array.isArray(loadedData)) {
            cardsData = loadedData;
            renderCards();
            alert('데이터를 성공적으로 불러왔습니다!');
          } else {
            alert('올바른 카드 데이터 형식이 아닙니다.');
          }
        } catch (err) {
          alert('JSON 파싱 오류가 발생했습니다.');
        }
      };
      reader.readAsText(file);
    });

    // 최초 렌더링
    renderCards();
  </script>
