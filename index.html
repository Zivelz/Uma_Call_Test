<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Ms. VICTORIA - 라이브 콜 가이드 플레이어</title>
  <style>
    :root {
      --bg-color: #0f1117;
      --card-bg: #1a1d26;
      --card-active: #242b3d;
      --primary: #f59e0b;
      --accent: #ec4899;
      --jp-color: #f3f4f6;
      --kr-color: #93c5fd;
      --pron-color: #6ee7b7;
      --action-color: #fbbf24;
      --call-color: #f43f5e;
      --border-color: #374151;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #111827;
      border-bottom: 1px solid var(--border-color);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .title-area h1 {
      font-size: 1.15rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .controls-top {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button {
      background: #374151;
      color: #fff;
      border: 1px solid #4b5563;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }
    button:hover { background: #4b5563; }
    button.btn-primary { background: var(--primary); color: #000; border: none; }
    button.btn-primary:hover { background: #d97706; }
    button.btn-accent { background: var(--accent); color: #fff; border: none; }
    button.btn-accent:hover { background: #db2777; }

    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .player-pane {
      width: 440px;
      background: #161a23;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 14px;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    .video-wrapper iframe, .video-wrapper #ytplayer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
    }

    .sync-tools {
      background: #1f2937;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sync-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .time-badge {
      font-family: monospace;
      font-size: 1.1rem;
      color: #60a5fa;
      font-weight: bold;
    }

    .lyrics-pane {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    /* 5단 세로 구조 카드 */
    .block-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      position: relative;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .block-card:hover {
      border-color: #6b7280;
    }

    .block-card.active {
      background: var(--card-active);
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.25);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #9ca3af;
      border-bottom: 1px dashed #374151;
      padding-bottom: 6px;
    }

    .time-tag {
      background: #374151;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }

    /* 5단 항목 스타일 */
    .field-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .field-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .val-action { color: var(--action-color); font-weight: 600; min-height: 20px; }
    .val-jp { color: var(--jp-color); font-size: 1.15rem; font-weight: 700; }
    .val-kr { color: var(--kr-color); font-size: 0.95rem; }
    .val-pron { color: var(--pron-color); font-size: 0.9rem; font-style: italic; }
    .val-call { color: var(--call-color); font-weight: 800; font-size: 1.05rem; min-height: 22px; }

    [contenteditable="true"] {
      outline: 1px dashed #6b7280;
      padding: 2px 4px;
      border-radius: 4px;
      background: rgba(255,255,255,0.03);
    }
    [contenteditable="true"]:focus {
      outline: 1px solid var(--primary);
      background: rgba(255,255,255,0.08);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-content {
      background: #1f2937;
      padding: 20px;
      border-radius: 10px;
      width: 550px;
      max-width: 90vw;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    textarea {
      background: #111827;
      color: #e5e7eb;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      font-family: monospace;
      height: 200px;
      resize: vertical;
    }
  </style>
</head>
<body>

  <header>
    <div class="title-area">
      <h1>🏆 Ms. VICTORIA 콜 가이드 동기화 뷰어</h1>
    </div>
    <div class="controls-top">
      <button id="toggleEditBtn" onclick="toggleEditMode()">✏️ 편집 모드 켜기</button>
      <button onclick="openImportModal()">📥 JSON 데이터 붙여넣기</button>
      <button onclick="exportJSON()">💾 저장 / 내보내기</button>
    </div>
  </header>

  <div class="main-container">
    <div class="player-pane">
      <div class="video-wrapper">
        <div id="ytplayer"></div>
      </div>

      <div class="sync-tools">
        <div class="sync-row">
          <span>현재 재생 시간:</span>
          <span class="time-badge" id="currTime">00:00.0</span>
        </div>
        <div class="sync-row" style="margin-top: 6px;">
          <button onclick="stampCurrentTime()">⏱ 현재 시간에 싱크 맞추기</button>
          <button onclick="addNewBlock()" class="btn-accent">+ 새 단락 추가</button>
        </div>
      </div>
      <div style="font-size: 0.78rem; color: #9ca3af; line-height: 1.4;">
        💡 <b>사용 팁:</b> 가사 카드를 클릭하면 영상이 해당 시점으로 점프합니다. 편집 모드를 켜면 동작 액션과 콜 항목을 직접 작성할 수 있습니다.
      </div>
    </div>

    <div class="lyrics-pane" id="lyricsPane">
      <!-- 동적 생성되는 세로 단락 카드들 -->
    </div>
  </div>

  <div class="modal" id="dataModal">
    <div class="modal-content">
      <h3>구글 드라이브 JSON 데이터 입력</h3>
      <p style="font-size: 0.8rem; color: #9ca3af;">드라이브에 있는 ms_victoria_call_guide.json의 내용을 복사해서 아래에 붙여넣으세요.</p>
      <textarea id="jsonInput" placeholder='{"blocks": [...]}'></textarea>
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button onclick="closeModal()">취소</button>
        <button class="btn-primary" onclick="applyImportedJSON()">적용하기</button>
      </div>
    </div>
  </div>

  <script>
    const VIDEO_ID = "vsnyQd6Ur-M";
    let isEditing = false;
    let selectedBlockIndex = null;

    // 기본 초기 샘플 데이터 (5단 세로 구조 표준)
    let guideData = [
      {
        "time": 0.0,
        "section": "Intro",
        "action": "",
        "lyrics_jp": "響き渡れ凱歌(がいか)よ (どこまでも)",
        "lyrics_kr": "널리 울려 퍼져라 승전가여 (끝없이 어디까지나)",
        "pron": "히비키와타레 가이카요 (도코마데모)",
        "call": ""
      },
      {
        "time": 7.5,
        "section": "Intro",
        "action": "",
        "lyrics_jp": "開かれた未来はもう (この手へと)",
        "lyrics_kr": "열린 미래는 이제 (이 손으로)",
        "pron": "히라카레타 미라이와 모오 (코노 테에토)",
        "call": ""
      },
      {
        "time": 15.0,
        "section": "Verse 1",
        "action": "",
        "lyrics_jp": "鮮烈(せんれつ)な日々を駆けた 夢と切り合って攻防戦、",
        "lyrics_kr": "강렬한 나날을 내달렸어, 꿈과 칼날을 겨누며 공방전,",
        "pron": "센레츠나 히비오 카케타 유메토 키리앗테 코오보오센,",
        "call": ""
      },
      {
        "time": 22.0,
        "section": "Verse 1",
        "action": "",
        "lyrics_jp": "一連托生(いちれんたくしょう)にPlay a game！",
        "lyrics_kr": "운명공동체(일련탁생)로 Play a game!",
        "pron": "이치렌타쿠쇼오니 Play a game!",
        "call": ""
      }
    ];

    // 유튜브 API 로더 (Error 153 방지 파라미터 적용)
    let player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('ytplayer', {
        videoId: VIDEO_ID,
        host: 'https://www.youtube-nocookie.com',
        playerVars: {
          autoplay: 0,
          playsinline: 1,
          rel: 0,
          enablejsapi: 1,
          origin: window.location.origin && window.location.origin !== "null" ? window.location.origin : undefined
        },
        events: {
          'onReady': onPlayerReady
        }
      });
    }

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onPlayerReady() {
      setInterval(updateSync, 100);
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      const ms = Math.floor((sec % 1) * 10);
      return `${m}:${s}.${ms}`;
    }

    let currentActiveIdx = -1;
    function updateSync() {
      if (!player || !player.getCurrentTime) return;
      const t = player.getCurrentTime();
      document.getElementById('currTime').innerText = formatTime(t);

      // 현재 시간에 매칭되는 단락 탐색
      let activeIdx = -1;
      for (let i = guideData.length - 1; i >= 0; i--) {
        if (t >= (guideData[i].time || 0)) {
          activeIdx = i;
          break;
        }
      }

      if (activeIdx !== currentActiveIdx && activeIdx !== -1) {
        currentActiveIdx = activeIdx;
        highlightBlock(activeIdx);
      }
    }

    function highlightBlock(idx) {
      document.querySelectorAll('.block-card').forEach((el, i) => {
        if (i === idx) {
          el.classList.add('active');
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
          el.classList.remove('active');
        }
      });
    }

    function renderBlocks() {
      const container = document.getElementById('lyricsPane');
      container.innerHTML = '';

      guideData.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'block-card';
        card.dataset.index = index;

        card.innerHTML = `
          <div class="card-header">
            <span>#${index + 1} [${item.section || 'Part'}]</span>
            <span class="time-tag" onclick="event.stopPropagation(); seekTo(${item.time || 0})">⏱ ${formatTime(item.time || 0)}</span>
          </div>

          <!-- 1단: 동작 / 액션 (원문 가사 위) -->
          <div class="field-row">
            <span class="field-label" style="color: var(--action-color);">Action (동작/액션)</span>
            <div class="val-action" contenteditable="${isEditing}" onblur="updateField(${index}, 'action', this.innerText)">${item.action || ''}</div>
          </div>

          <!-- 2단: 원문 가사 (JP) -->
          <div class="field-row">
            <span class="field-label" style="color: var(--jp-color);">JP Lyrics</span>
            <div class="val-jp" contenteditable="${isEditing}" onblur="updateField(${index}, 'lyrics_jp', this.innerText)">${item.lyrics_jp || item.jp_lyrics || ''}</div>
          </div>

          <!-- 3단: 한국어 번역 (KR) -->
          <div class="field-row">
            <span class="field-label" style="color: var(--kr-color);">KR Meaning</span>
            <div class="val-kr" contenteditable="${isEditing}" onblur="updateField(${index}, 'lyrics_kr', this.innerText)">${item.lyrics_kr || item.kr_meaning || ''}</div>
          </div>

          <!-- 4단: 발음 독음 -->
          <div class="field-row">
            <span class="field-label" style="color: var(--pron-color);">Pronunciation</span>
            <div class="val-pron" contenteditable="${isEditing}" onblur="updateField(${index}, 'pron', this.innerText)">${item.pron || item.kr_pron || ''}</div>
          </div>

          <!-- 5단: 콜 가이드 -->
          <div class="field-row">
            <span class="field-label" style="color: var(--call-color);">Call (콜 파트)</span>
            <div class="val-call" contenteditable="${isEditing}" onblur="updateField(${index}, 'call', this.innerText)">${item.call || ''}</div>
          </div>
        `;

        card.onclick = () => {
          selectedBlockIndex = index;
          seekTo(item.time || 0);
        };

        container.appendChild(card);
      });
    }

    function seekTo(sec) {
      if (player && player.seekTo) {
        player.seekTo(sec, true);
      }
    }

    function updateField(idx, key, val) {
      guideData[idx][key] = val.trim();
    }

    function toggleEditMode() {
      isEditing = !isEditing;
      const btn = document.getElementById('toggleEditBtn');
      if (isEditing) {
        btn.innerText = "🔒 편집 완료 (잠금)";
        btn.classList.add('btn-primary');
      } else {
        btn.innerText = "✏️ 편집 모드 켜기";
        btn.classList.remove('btn-primary');
      }
      renderBlocks();
    }

    function stampCurrentTime() {
      if (!player || !player.getCurrentTime) return;
      const t = player.getCurrentTime();
      if (selectedBlockIndex !== null && guideData[selectedBlockIndex]) {
        guideData[selectedBlockIndex].time = Math.round(t * 10) / 10;
        guideData.sort((a, b) => (a.time || 0) - (b.time || 0));
        renderBlocks();
      } else {
        alert("시간을 갱신할 가사 카드를 먼저 클릭해 선택해주세요.");
      }
    }

    function addNewBlock() {
      const t = player && player.getCurrentTime ? Math.round(player.getCurrentTime() * 10) / 10 : 0;
      guideData.push({
        time: t,
        section: "Live",
        action: "",
        lyrics_jp: "새 가사 입력",
        lyrics_kr: "한국어 번역 입력",
        pron: "발음 입력",
        call: ""
      });
      guideData.sort((a, b) => (a.time || 0) - (b.time || 0));
      renderBlocks();
    }

    function openImportModal() {
      document.getElementById('dataModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('dataModal').style.display = 'none';
    }

    function applyImportedJSON() {
      try {
        const raw = document.getElementById('jsonInput').value;
        const parsed = JSON.parse(raw);
        const blocks = parsed.blocks || parsed;
        if (Array.isArray(blocks)) {
          guideData = blocks.map((b, i) => ({
            time: b.time || (i * 4.0),
            section: b.section || `Part ${i+1}`,
            action: b.action || "",
            lyrics_jp: b.jp_lyrics || b.lyrics_jp || "",
            lyrics_kr: b.kr_meaning || b.lyrics_kr || "",
            pron: b.kr_pron || b.pron || "",
            call: b.call || ""
          }));
          renderBlocks();
          closeModal();
        } else {
          alert("유효한 블록 리스트 배열이 아닙니다.");
        }
      } catch (e) {
        alert("JSON 파싱 에러: 올바른 JSON 문자열을 입력해주세요.");
      }
    }

    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(guideData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "ms_victoria_call_guide_updated.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    // 초기 렌더링
    renderBlocks();
  </script>
</body>
</html>
