<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ms. VICTORIA - 라이브 콜 가이드 플레이어</title>
  <style>
    :root {
      --bg: #090b14;
      --card-bg: rgba(18, 24, 43, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-active-bg: rgba(28, 38, 70, 0.95);
      --card-active-border: #facc15;
      
      /* 요청 컬러 팔레트 */
      --color-action: #fde047;  /* 1단 동작: 노란색 */
      --color-jp: #ffffff;      /* 2단 원문: 흰색 */
      --color-kr: #38bdf8;      /* 3단 번역: 파란색 */
      --color-pron: #c084fc;    /* 4단 독음: 보라색 */
      --color-call: #fb7185;    /* 5단 콜: 핑크 */

      --text-sub: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      background: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, #17203b 0%, #090b14 75%);
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* 상단 헤더 */
    header {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      z-index: 50;
    }
    .header-title h1 { font-size: 1.05rem; font-weight: 800; color: #fff; }
    .header-title span { font-size: 0.75rem; color: var(--color-action); font-weight: 600; }

    .toggle-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }
    .toggle-btn {
      background: #1e293b;
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .toggle-btn.active {
      background: #334155;
      border-color: var(--color-action);
      color: #fff;
      font-weight: 600;
    }

    /* 메인 뷰포트 레이아웃 */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 460px 1fr;
      gap: 20px;
      padding: 16px;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
      height: calc(100% - 55px);
      overflow: hidden;
    }

    /* 좌측 고정 패널 */
    .player-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100%;
      overflow-y: auto;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      flex-shrink: 0;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }
    .status-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: monospace;
      font-size: 0.95rem;
      color: var(--color-action);
      flex-shrink: 0;
    }
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      flex-shrink: 0;
    }
    .btn {
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      transition: all 0.2s;
    }
    .btn-primary { background: #2563eb; grid-column: span 2; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #1e293b; border: 1px solid var(--card-border); color: #cbd5e1; }
    .btn-secondary:hover { background: #334155; }

    /* 우측 독립 스크롤 타임라인 */
    .timeline-section {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 4px 10px 40px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      scroll-behavior: smooth;
    }
    .timeline-section::-webkit-scrollbar { width: 6px; }
    .timeline-section::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); border-radius: 3px; }
    .timeline-section::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 3px; }
    .timeline-section::-webkit-scrollbar-thumb:hover { background: var(--color-action); }

    /* 모바일 반응형: 상하 분할 스크롤 */
    @media (max-width: 900px) {
      main {
        display: flex;
        flex-direction: column;
        padding: 8px;
        gap: 10px;
        height: calc(100% - 50px);
      }
      .player-section {
        flex-shrink: 0;
        height: auto;
        overflow: visible;
        padding-bottom: 4px;
        border-bottom: 1px solid var(--card-border);
      }
      .video-wrapper { max-height: 200px; }
      .timeline-section {
        flex: 1;
        width: 100%;
        padding-bottom: 60px;
      }
    }

    /* 카드 스타일 (2줄 가사 최적화) */
    .lyric-card {
      width: 100%;
      max-width: 700px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      flex-shrink: 0;
    }
    .lyric-card:hover {
      border-color: rgba(250, 204, 21, 0.4);
      transform: translateY(-2px);
    }
    .lyric-card.active {
      background: var(--card-active-bg);
      border-color: var(--card-active-border);
      box-shadow: 0 0 24px rgba(250, 204, 21, 0.35);
      transform: scale(1.015);
    }

    .card-meta {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px dashed rgba(255,255,255,0.06);
    }
    .time-edit-box {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge-time {
      color: var(--color-action);
      font-family: monospace;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .card-tools {
      display: none;
      align-items: center;
      gap: 6px;
    }
    body.is-editing .card-tools { display: flex; }
    .btn-mini {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.15);
      color: #cbd5e1;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .btn-mini:hover { background: #334155; color: #fff; }
    .btn-delete { color: #f87171; border-color: rgba(248, 113, 113, 0.3); }
    .btn-delete:hover { background: #7f1d1d; color: #fff; }

    /* 5단 세로 필드 */
    .field-block {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .field-row {
      width: 100%;
      word-break: keep-all;
      overflow-wrap: break-word;
      white-space: pre-wrap;
      font-family: "Consolas", "Courier New", "Noto Sans Mono", monospace, sans-serif;
      min-height: 0;
      line-height: 1.5;
      text-align: center;
    }

    /* 1. 동작 액션 (노란색) */
    .row-action { color: var(--color-action); font-size: 0.92rem; font-weight: 700; }
    /* 2. 일본어 원문 (흰색, 2줄 대형 폰트) */
    .row-jp { color: var(--color-jp); font-size: 1.15rem; font-weight: 800; }
    /* 3. 한국어 번역 (파란색) */
    .row-kr { color: var(--color-kr); font-size: 0.96rem; font-weight: 600; }
    /* 4. 독음 (보라색) */
    .row-pron { color: var(--color-pron); font-size: 0.9rem; font-weight: 500; }
    /* 5. 콜 파트 (핑크) */
    .row-call { color: var(--color-call); font-size: 1.05rem; font-weight: 800; }

    /* 빈 텍스트 행 완전 숨김 */
    body:not(.is-editing) .field-row:empty {
      display: none !important;
    }

    /* 편집 모드 스타일 */
    body.is-editing .field-row {
      min-height: 26px;
      padding: 3px 8px;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      margin-bottom: 3px;
    }
    body.is-editing .field-row:empty::after {
      content: attr(data-placeholder);
      color: rgba(255, 255, 255, 0.3);
      font-style: italic;
      font-size: 0.8rem;
    }
    body.is-editing .badge-time {
      border-bottom: 1px dashed var(--color-action);
      padding: 1px 4px;
      cursor: text;
    }

    /* 토글 스위치에 따른 숨김 */
    body.hide-action .row-action { display: none !important; }
    body.hide-jp .row-jp { display: none !important; }
    body.hide-kr .row-kr { display: none !important; }
    body.hide-pron .row-pron { display: none !important; }
    body.hide-call .row-call { display: none !important; }
  </style>
</head>

      <button class="toggle-btn active" data-target="hide-kr">번역</button>
      <button class="toggle-btn active" data-target="hide-pron">독음</button>
      <button class="toggle-btn active" data-target="hide-call">콜</button>
    </div>
  </header>

  <main>
    <!-- 좌측 고정 비디오 패널 -->
    <section class="player-section">

        <button class="btn btn-secondary" id="btn-add-card">➕ 현재 시점 카드 추가</button>
        <button class="btn btn-secondary" id="btn-export-json">💾 데이터 저장(JSON)</button>

    </section>

    <!-- 우측 독립 스크롤 2줄 카드 리스트 -->
    <section class="timeline-section" id="cards-container">

    </section>
  </main>

        jp: "響かせようよ凱歌を\nどこまでも Ah",
        kr: "울려 퍼지게 하자 승리의 함성을\n어디까지나 Ah",
        pron: "히비카세요-요 가이카오\n도코마데모 Ah",
        call: ""
      },
      {
        time: 178.5,
        action: "",
        jp: "遮る物のない地平へ\n開かれた未来はもう",
        kr: "가로막는 것 하나 없는 지평선으로\n열린 미래는 이미",
        pron: "사에기루 모노노 나이 치헤이에\n히라카레타 미라이와 모-",
        call: ""
      },
      {
        time: 186.0,
        action: "",
        jp: "揺るぎのない Place\n天上天下そう讃えてる",
        kr: "흔들림 없는 곳 (Place)\n천상천하 그렇게 칭송하고 있어",
        pron: "유루기노 나이 Place\n텐쇼-텐게 소- 타타에테루",
        call: ""
      },
      {
        time: 194.0,
        action: "",
        jp: "I've got pride and dreams\nさあ、笑顔を見せて",
        kr: "I've got pride and dreams\n자, 환한 미소를 보여줘",
        pron: "I've got pride and dreams\n사-, 에가오오 미세테",
        call: ""
      },
      {
        time: 202.0,
        action: "",
        jp: "刻まれたんだ\nMy history, my victory！",
        kr: "깊이 새겨진 거야\nMy history, my victory!",
        pron: "키자마레탄다\nMy history, my victory!",
        call: ""
      },
      {
        time: 215.0,
        action: "",
        jp: "響き渡れ凱歌よ (どこまでも)\n開かれた未来はもう (この手へと)",
        kr: "울려 퍼져라 승리의 함성이여 (어디까지나)\n열린 미래는 이미 (이 손으로)",
        pron: "히비키와타레 가이카요 (도코마데모)\n히라카레타 미라이와 모- (코노 테에토)",
        call: ""
      },
      {
        time: 228.0,
        action: "",
        jp: "Ms. VICTORIA\n",
        kr: "Ms. VICTORIA\n",
        pron: "미스 빅토리아\n",
        call: ""
      }
    ];

    let isEditing = false;
    let player = null;
    let syncInterval = null;

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', {
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      const statusText = document.getElementById('sync-status');
      if (event.data === YT.PlayerState.PLAYING) {
        statusText.textContent = "▶ LIVE SYNC";
        if (!syncInterval) syncInterval = setInterval(updateSync, 100);
      } else {
        statusText.textContent = "⏸ PAUSED";
        clearInterval(syncInterval);
        syncInterval = null;
      }
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = (sec % 60).toFixed(1);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(4, '0')}`;
    }

    function parseTimeString(str) {
      str = str.replace(/[\[\]]/g, '').trim();
      if (str.includes(':')) {
        const parts = str.split(':');
        const m = parseFloat(parts[0]) || 0;
        const s = parseFloat(parts[1]) || 0;
        return m * 60 + s;
      }
      return parseFloat(str) || 0;
    }

    function updateSync() {
      if (!player || !player.getCurrentTime) return;
      const cur = player.getCurrentTime();
      const dur = player.getDuration() || 0;
      document.getElementById('time-display').textContent = `${formatTime(cur)} / ${formatTime(dur)}`;

      let activeIdx = -1;
      for (let i = 0; i < cardsData.length; i++) {
        if (cur >= cardsData[i].time) activeIdx = i;
        else break;
      }

      document.querySelectorAll('.lyric-card').forEach((card, idx) => {
        if (idx === activeIdx) {
          if (!card.classList.contains('active')) {
            card.classList.add('active');
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        } else {
          card.classList.remove('active');
        }
      });
    }

    function renderCards() {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      cardsData.sort((a, b) => a.time - b.time);

      cardsData.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'lyric-card';
        card.dataset.index = index;

        card.innerHTML = `
          <div class="card-meta">
            <div class="time-edit-box">
              <span class="badge-time" data-placeholder="00:00.0">[${formatTime(item.time)}]</span>
              <div class="card-tools">
                <button class="btn-mini btn-sync-now" title="현재 시점으로 맞춤">⏱ 현시점</button>
                <button class="btn-mini btn-delete" title="카드 삭제">✕</button>
              </div>
            </div>
            <span>#${String(index + 1).padStart(2, '0')}</span>
          </div>

          <div class="field-block">
            <div class="field-row row-action" data-field="action" data-placeholder="[동작/액션 입력]">${item.action || ''}</div>
            <div class="field-row row-jp" data-field="jp" data-placeholder="[일본어 가사 입력]">${item.jp || ''}</div>
            <div class="field-row row-kr" data-field="kr" data-placeholder="[한국어 번역 입력]">${item.kr || ''}</div>
            <div class="field-row row-pron" data-field="pron" data-placeholder="[발음 독음 입력]">${item.pron || ''}</div>
            <div class="field-row row-call" data-field="call" data-placeholder="[콜 타이밍 및 구호 입력]">${item.call || ''}</div>
          </div>
        `;

        card.addEventListener('click', () => {
          if (isEditing) return;
          if (player && player.seekTo) player.seekTo(item.time, true);
        });

        const timeBadge = card.querySelector('.badge-time');
        timeBadge.contentEditable = isEditing;
        timeBadge.addEventListener('blur', () => {
          const parsed = parseTimeString(timeBadge.innerText);
          cardsData[index].time = parseFloat(parsed.toFixed(1));
          timeBadge.innerText = `[${formatTime(cardsData[index].time)}]`;
        });

        const btnSyncNow = card.querySelector('.btn-sync-now');
        btnSyncNow.addEventListener('click', (e) => {
          e.stopPropagation();
          if (player && player.getCurrentTime) {
            const cur = parseFloat(player.getCurrentTime().toFixed(1));
            cardsData[index].time = cur;
            timeBadge.innerText = `[${formatTime(cur)}]`;
          }
        });

        const btnDelete = card.querySelector('.btn-delete');
        btnDelete.addEventListener('click', (e) => {
          e.stopPropagation();
          cardsData.splice(index, 1);
          renderCards();
        });

        card.querySelectorAll('.field-row').forEach(row => {
          row.contentEditable = isEditing;
          row.addEventListener('input', () => {
            const field = row.dataset.field;
            cardsData[index][field] = row.innerText;
          });
        });

        container.appendChild(card);
      });
    }

    // 편집 모드 토글
    document.getElementById('btn-toggle-edit').addEventListener('click', (e) => {
      isEditing = !isEditing;
      document.body.classList.toggle('is-editing', isEditing);
      e.target.textContent = isEditing ? '✅ 편집 완료 (시간순 정렬 및 저장)' : '✏️ 가사/시간/콜 편집 켜기';
      e.target.style.background = isEditing ? '#059669' : '#2563eb';
      renderCards();
    });

    // 새 카드 추가
    document.getElementById('btn-add-card').addEventListener('click', () => {
      const curTime = (player && player.getCurrentTime) ? player.getCurrentTime() : 0;
      cardsData.push({
        time: parseFloat(curTime.toFixed(1)),
        action: "",
        jp: "",
        kr: "",
        pron: "",
        call: ""
      });
      renderCards();
    });

    // 항목 표시/숨김 토글
    document.querySelectorAll('.toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.dataset.target;
        btn.classList.toggle('active');
        document.body.classList.toggle(target, !btn.classList.contains('active'));
      });
    });

    // JSON 내보내기
    document.getElementById('btn-export-json').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(cardsData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'ms_victoria_call_cards.json';
      a.click();
      URL.revokeObjectURL(url);
    });

    // 초기 실행
    renderCards();
  </script>
</body>
</html>
